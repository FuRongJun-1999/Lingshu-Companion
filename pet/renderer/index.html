<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>灵枢伴侣 · 桌宠</title>
<style>
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    -webkit-app-region: drag;            /* 整窗可拖动 */
    -webkit-user-select: none; user-select: none;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
  }
  #stage { position: fixed; inset: 0; pointer-events: none; }
  canvas { display: block; }

  /* 齿轮：可拖动，位置记住。穿透状态下也能靠它恢复 */
  #gear {
    position: fixed; right: 6px; top: 6px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(18,26,40,.82); color: #8cf;
    border: 1px solid rgba(140,200,255,.4);
    font-size: 17px; line-height: 30px; text-align: center;
    cursor: move; -webkit-app-region: no-drag;
    opacity: .55; transition: opacity .18s, background .18s;
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
    z-index: 30;
  }
  #gear:hover { opacity: 1; background: rgba(40,66,102,.95); }
  #gear.on { opacity: 1; background: rgba(50,90,140,.95); }

  /* 面板 */
  #panel {
    position: fixed; width: 216px;
    background: rgba(13,19,29,.95); border: 1px solid rgba(140,200,255,.3);
    border-radius: 10px; padding: 10px 12px; color: #cde;
    font-size: 12px; -webkit-app-region: no-drag;
    display: none; backdrop-filter: blur(9px);
    box-shadow: 0 8px 26px rgba(0,0,0,.55);
    max-height: calc(100vh - 20px); overflow-y: auto;
    z-index: 20;
  }
  #panel.open { display: block; }
  #panel h4 {
    margin: 0 0 9px; font-size: 12px; font-weight: 600; color: #7cf;
    letter-spacing: .5px; cursor: move;
    display: flex; justify-content: space-between; align-items: center;
  }
  #panel h4 .dot { color: #567; font-size: 10px; font-weight: 400; }
  .row { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
  .row label { flex: 0 0 52px; color: #8aa; font-size: 11px; }
  .row input[type=range] { flex: 1; height: 3px; accent-color: #4af; }
  .row .val { flex: 0 0 46px; text-align: right; color: #7cf;
              font-variant-numeric: tabular-nums; font-size: 11px; }
  .row select {
    flex: 1; background: rgba(30,42,60,.95); color: #cde;
    border: 1px solid rgba(140,200,255,.28); border-radius: 5px;
    padding: 3px 4px; font-size: 11px; outline: none;
  }
  .sep { height: 1px; background: rgba(140,200,255,.16); margin: 10px 0; }
  .btns { display: flex; gap: 6px; margin-top: 8px; }
  .btns button {
    flex: 1; background: rgba(30,42,60,.95); color: #9cf;
    border: 1px solid rgba(140,200,255,.28); border-radius: 5px;
    padding: 4px 0; font-size: 11px; cursor: pointer;
  }
  .btns button:hover { background: rgba(52,84,124,.95); }
  .chk { display: flex; align-items: center; gap: 6px; margin: 6px 0;
         color: #8aa; font-size: 11px; }
  .chk input { accent-color: #4af; }
</style>
</head>
<body>
  <div id="stage"></div>

  <div id="gear" title="点击开关面板 · 拖动移动位置">⚙</div>

  <div id="panel">
    <h4>操控面板 <span class="dot">按住标题拖动</span></h4>

    <div class="row">
      <label>窗口大小</label>
      <input id="pWin" type="range" min="180" max="1400" step="10" value="860">
      <span class="val" id="vWin">860</span>
    </div>
    <div class="row">
      <label>模型缩放</label>
      <input id="pZoom" type="range" min="30" max="200" step="1" value="100">
      <span class="val" id="vZoom">100%</span>
    </div>

    <div class="sep"></div>

    <div class="row">
      <label>表情</label>
      <select id="pExpr"><option value="">（不切换）</option></select>
    </div>
    <div class="row">
      <label>动作</label>
      <select id="pMotion"><option value="">（不播放）</option></select>
    </div>

    <div class="sep"></div>

    <div class="row">
      <label>帧率</label>
      <select id="pFps">
        <option value="30">30</option>
        <option value="60" selected>60</option>
        <option value="0">不限</option>
      </select>
    </div>

    <label class="chk"><input id="pBlink" type="checkbox" checked> 自动眨眼</label>
    <label class="chk"><input id="pIdle" type="checkbox" checked> 待机动作</label>

    <div class="btns">
      <button id="btnReset">复位</button>
      <button id="btnPass">穿透</button>
    </div>
  </div>

  <script src="http://127.0.0.1:8770/lib/pixi.min.js"></script>
  <script src="http://127.0.0.1:8770/lib/live2dcubismcore.min.js"></script>
  <script src="http://127.0.0.1:8770/lib/cubism4.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
